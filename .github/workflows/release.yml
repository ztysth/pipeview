name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: pipeview
            builder: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: pipeview
            builder: cross
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            bin: pipeview
            builder: cross
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: pipeview
            builder: cargo
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: pipeview
            builder: cargo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: pipeview.exe
            builder: cargo
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: pipeview.exe
            builder: cargo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.builder }}" == "cross" ]]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package="pipeview-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${package}/"
          cp README.md LICENSE "dist/${package}/"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeview-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --generate-notes
